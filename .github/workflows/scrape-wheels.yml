name: Refresh wheel index

on:
  workflow_dispatch:
    inputs:
      max_versions:
        description: "Maximum PyPI versions to inspect (0 = all)"
        required: false
        default: "0"
        type: string
      max_github_releases:
        description: "Maximum GitHub releases to inspect (0 = all)"
        required: false
        default: "0"
        type: string
      recent_commits:
        description: "Recent main-branch commits to inspect"
        required: false
        default: "20"
        type: string
  schedule:
    - cron: "0 6 * * *"

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install index builder
        run: python -m pip install .

      - name: Run tests
        run: python -m unittest discover -v

      - name: Refresh all wheel sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m vllm_wheels \
            --max-versions "${{ inputs.max_versions || '0' }}" \
            --max-github-releases "${{ inputs.max_github_releases || '0' }}" \
            --recent-commits "${{ inputs.recent_commits || '20' }}"

      - name: Commit refreshed data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Refresh wheel index"
            git push
          fi
